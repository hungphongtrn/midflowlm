# SFT Flow Midblock -- Full Training Config
# Target: 24GB+ GPU (RTX 3090/4090, A6000, H100)
#
# Estimated budget:
#   ~100K packed sequences x 8192 tokens x T=32 x 1 epoch
#   ~= 800M tokens processed
#   ~= 10-15 hours on RTX 4090 @ ~0.3 steps/sec (ODE overhead)

seed: 1337

model:
  name: "Qwen/Qwen3.5-0.8B"
  start_layer: 8
  end_layer: 11
  thinking_level: 32  # Fixed T=32

data:
  dataset:
    name: "Jackrong/GLM-5.1-Reasoning-1M-Cleaned"
    split: "train"
  processing:
    max_total_tokens: 8192
    num_proc: 4
    val_split: 0.001  # ~1K eval samples from ~1M dataset
    max_train_samples: null
    max_eval_samples: null  # Use all val split (~1K samples)
    packing_strategy: "bfd"
    seed: 1337
  cache_dir: "./data/reasoning_sft_cache"
  max_seq_length: 8192

training:
  output_dir: "./outputs/issue-9/sft_flow_midblock"
  run_name: "sft_flow_midblock_full"

  # Memory budget: ~20GB for model + data + ODE intermediate states
  # Peak VRAM with BS=1 was 4.2GB — plenty of headroom on 24GB
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2  # Effective BS = 8

  # Schedule
  num_train_epochs: 1
  learning_rate: 1.0e-4
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.95
  lr_scheduler: "cosine"
  warmup_steps: 100

  # Checkpointing
  save_strategy: "steps"
  save_steps: 500
  save_total_limit: 3
  save_only_model: false

  # Logging
  logging_steps: 10
  report_to: ["wandb"]
  include_num_input_tokens_seen: true

  # Evaluation
  eval_strategy: "steps"
  eval_steps: 500
  eval_on_start: true
  eval_accumulation_steps: 1
  prediction_loss_only: true

  # Performance
  dataloader_num_workers: 2
  gradient_checkpointing: true  # Frees Qwen layer activations
  dataloader_drop_last: false
  dataloader_pin_memory: true

  # Hub push
  push_to_hub: true
  hub_model_id: "hungphongtrn/midflowlm-phase2"
  hub_strategy: "end"

checkpoint:
  path: "models/p3_d3_mix_c/checkpoint.pth"
  remote_repo: "hungphongtrn/midflowlm-phase1"
  remote_filename: "p3_d3_mix_c/checkpoint.pth"
