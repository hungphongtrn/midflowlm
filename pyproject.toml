[project]
name = "midflowlm"
version = "0.1.0"
description = "Iterative latent matching / distillation for language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "datasets",
    "torchmetrics",
    "torchdiffeq",
    "einops",
    "pyyaml",
    "safetensors",
    "numpy",
    "tqdm",
    "accelerate",
    "wandb",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = []

[tool.hatch.build.targets.wheel]
packages = ["src"]
