[project]
name = "midflowlm"
version = "0.1.0"
description = "Iterative latent matching / distillation for language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "datasets",
    "torchmetrics",
    "torchdiffeq",
    "einops",
    "pyyaml",
    "safetensors",
    "numpy",
    "tqdm",
    "accelerate",
    "wandb",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = []

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
